<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17140f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<title>Iron Dialectic</title>
<meta name="description" content="A grand strategy of belief and power. Run a state whose every rule follows from its ideology.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23c8281e%27/%3E%3Cpath d=%27M16 4l3.5 8.2 8.9.8-6.7 5.9 2 8.7L16 23l-7.7 4.6 2-8.7-6.7-5.9 8.9-.8z%27 fill=%27%2317140f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=b5787637bc">
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="World map"></canvas>

  <div id="title" class="screen"></div>

  <div id="hud" hidden>
    <header id="top"></header>
    <nav id="rail" aria-label="Panels"></nav>
    <aside id="drawer" hidden></aside>
    <aside id="sel" hidden></aside>
    <div id="alerts"></div>
    <div id="atkbar" hidden></div>
    <div id="modes"></div>
    <footer id="ticker"><div id="tickin"></div></footer>
  </div>

  <div id="coach" hidden></div>
  <div id="modal" hidden></div>
  <div id="toasts"></div>
  <div id="tip" hidden></div>
</div>
<script src="js/game.min.js?v=3fe7639088"></script>
<script>
/* The game is many parts, and a part that did not arrive (a dropped connection, a copy of the page left over from an
   older version of the site) used to show up much later as one panel that would not draw. This checks once, after
   everything should have loaded, and says so plainly, with a way to fetch a clean copy. Saves are not touched. */
(function () {
  try { sessionStorage.removeItem('id_stale_reload'); } catch (e) { /* private mode */ }
  var PANELS = ['brief', 'gov', 'reg', 'eco', 'law', 'prog', 'mil', 'for', 'sov', 'world', 'help'];
  function missing() {
    var I = window.ID, out = [];
    if (!I) return ['the game itself'];
    ['Combat', 'Politics', 'Economy', 'Diplomacy', 'Events', 'Game', 'Focus', 'Navy', 'Render', 'UI', 'Screens', 'Main', 'Panels'].forEach(function (k) { if (!I[k]) out.push(k); });
    if (I.Panels) PANELS.forEach(function (k) { if (typeof I.Panels[k] !== 'function') out.push('the ' + k + ' panel'); });
    return out;
  }
  window.idLoadCheck = missing;
  window.idFreshCopy = function () { location.replace(location.pathname + '?r=' + Date.now()); };
  window.addEventListener('load', function () {
    var m = missing(); if (!m.length) return;
    var d = document.createElement('div');
    d.id = 'loadfail';
    d.style.cssText = 'position:fixed;z-index:99999;left:0;right:0;top:0;padding:14px 16px;background:#c8281e;color:#fff;font:16px/1.4 sans-serif;text-align:center';
    d.innerHTML = '<b>Part of the game did not load</b> (' + m.slice(0, 4).join(', ') + (m.length > 4 ? ' and ' + (m.length - 4) + ' more' : '') + '). Your saves are safe. <button style="margin-left:10px;padding:6px 14px;font:inherit;cursor:pointer">Reload a clean copy</button>';
    d.querySelector('button').addEventListener('click', window.idFreshCopy);
    document.body.appendChild(d);
  });
})();
</script>
</body>
</html>
